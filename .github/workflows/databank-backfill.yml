name: OPHANIM Data Bank · Backfill history

# Run once (Actions tab → this workflow → Run workflow). Safe to re-run: it only adds or corrects rows.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated sources (blank = all). e.g. fred,fx_ecb"
        required: false
        default: ""
      gdelt_minutes:
        description: "Minutes to spend on GDELT raw files this run (history fills backward; re-run to continue)"
        required: false
        default: "280"

permissions:
  contents: write

concurrency:
  group: databank
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the deepest history every source offers
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          ONLY: ${{ inputs.only }}
          GDELT_EVENTS_MINUTES: ${{ inputs.gdelt_minutes }}
        run: python -m tools.databank.run --mode backfill --bank databank --only "$ONLY"

      - name: Commit to the bank
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add databank
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "databank: historical backfill $(date -u +%F)"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((i * 10))
          done
          exit 1
