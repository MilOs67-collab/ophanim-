name: OPHANIM Data Bank · Nightly

# Every night, forever: snapshot every feed, compound it into databank/, archive raw payloads.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC ≈ 1:17 AM Houston
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: databank
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "websockets>=14"

      - name: Collect every feed
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python -m tools.databank.run --mode nightly --bank databank --raw "$RUNNER_TEMP/raw"

      - name: Archive full raw snapshot (monthly release, one file per night)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAW="$RUNNER_TEMP/raw"
          [ -d "$RAW" ] && [ -n "$(ls -A "$RAW")" ] || { echo "no raw payloads"; exit 0; }
          D=$(date -u +%F); M=$(date -u +%Y-%m); TAG="databank-raw-$M"
          tar -C "$RAW" -cf "$RUNNER_TEMP/raw-$D.tar" .
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Data Bank raw archive · $M" --latest=false \
            --notes "Untouched nightly payloads from every OPHANIM feed (aircraft, ships, satellites, news, markets). One raw-YYYY-MM-DD.tar per night."
          gh release upload "$TAG" "$RUNNER_TEMP/raw-$D.tar" --clobber

      - name: Commit to the bank
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add databank
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "databank: nightly $(date -u +%F)"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((i * 10))
          done
          exit 1
